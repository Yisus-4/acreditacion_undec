# ---------------------------------------------------------------------------
# Perfil "postgres" -- persistencia real con Flyway + PostgreSQL.
# ---------------------------------------------------------------------------
# Las credenciales se inyectan por variables de entorno (backend/.env) o por
# el sistema de environment de Spring Boot. Si falta alguna, la app falla
# rápido con un error claro.
#
# Variables requeridas:
#   SPRING_DATASOURCE_URL      jdbc:postgresql://localhost:5432/acreditacion
#   SPRING_DATASOURCE_USERNAME usuario de la base
#   SPRING_DATASOURCE_PASSWORD clave de la base
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
